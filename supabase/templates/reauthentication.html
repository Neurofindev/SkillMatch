<!doctype html>
<html lang="fr">
  <body style="margin: 0; background: #f4f7f6; color: #17211d; font-family: Arial, sans-serif">
    <main style="max-width: 600px; margin: 0 auto; padding: 32px 20px">
      <div style="background: #ffffff; border: 1px solid #dce5e1; border-radius: 16px; padding: 32px">
        <p style="margin: 0 0 24px; color: #177a55; font-size: 18px; font-weight: 700">SkillMatch</p>
        <h1 style="margin: 0 0 16px; font-size: 24px">Votre code de vérification</h1>
        <p style="margin: 0 0 18px; line-height: 1.6">Utilisez ce code pour confirmer votre identité :</p>
        <p style="margin: 0 0 24px; letter-spacing: 0.18em; font-size: 28px; font-weight: 700">{{ .Token }}</p>
        <p style="margin: 0; color: #56645e; font-size: 14px; line-height: 1.5">Ce code expire rapidement. Si vous ne l’avez pas demandé, ignorez cet e-mail.</p>
      </div>
    </main>
  </body>
</html>
