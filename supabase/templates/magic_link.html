<!doctype html>
<html lang="fr">
  <body style="margin: 0; background: #f4f7f6; color: #17211d; font-family: Arial, sans-serif">
    <main style="max-width: 600px; margin: 0 auto; padding: 32px 20px">
      <div style="background: #ffffff; border: 1px solid #dce5e1; border-radius: 16px; padding: 32px">
        <p style="margin: 0 0 24px; color: #177a55; font-size: 18px; font-weight: 700">SkillMatch</p>
        <h1 style="margin: 0 0 16px; font-size: 24px">Votre lien de connexion</h1>
        <p style="margin: 0 0 24px; line-height: 1.6">Utilisez ce lien à usage unique pour accéder à SkillMatch.</p>
        <p style="margin: 0 0 20px"><a href="{{ .ConfirmationURL }}" style="display: inline-block; border-radius: 10px; background: #177a55; color: #ffffff; padding: 13px 20px; font-weight: 700; text-decoration: none">Me connecter</a></p>
        <p style="margin: 0 0 24px; color: #56645e; font-size: 14px">Code de vérification : <strong style="color: #17211d">{{ .Token }}</strong></p>
        <p style="margin: 0; color: #56645e; font-size: 14px; line-height: 1.5">Si vous n’avez pas demandé ce lien, ignorez cet e-mail.</p>
      </div>
    </main>
  </body>
</html>
